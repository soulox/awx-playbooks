---
- name: Create Ubuntu VM on Proxmox
  hosts: localhost
  gather_facts: no
  connection: local

  collections:
    - community.proxmox

  vars:
    proxmox_api_host: "your-proxmox-ip"
    proxmox_api_user: "root@pam"
    proxmox_api_password: "{{ proxmox_password }}"
    proxmox_node: "pve"

    vm_id: 100
    vm_name: "ubuntu-server-01"
    vm_memory: 2048
    vm_cores: 2
    vm_disk_size: "20G"
    vm_storage: "local-lvm"
    vm_network_bridge: "vmbr0"

    ubuntu_iso: "ubuntu-22.04-server-amd64.iso"
    iso_storage: "local"

  tasks:
- name: Create Ubuntu VM
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ vm_id }}"
    name: "{{ vm_name }}"
    memory: "{{ vm_memory }}"
    cores: "{{ vm_cores }}"
    cpu: "host"
    ostype: "l26"

    # CD-ROM on IDE (ide2 equivalent)
    ide:
      ide2: "{{ iso_storage }}:iso/{{ ubuntu_iso }},media=cdrom"

    # Disk on SCSI (scsi0 equivalent)
    scsi:
      scsi0: "{{ vm_storage }}:{{ vm_disk_size }}"

    scsihw: "virtio-scsi-pci"

    # NIC (net0 equivalent)
    net:
      net0: "virtio,bridge={{ vm_network_bridge }}"

    boot: "cdn"
    bootdisk: "scsi0"
    state: present
  register: vm_result

- name: Start the VM
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ vm_id }}"
    state: started